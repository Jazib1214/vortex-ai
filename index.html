<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Google Console Verification Tag -->
    <meta name="google-site-verification" content="vortex-ai-verification-raja-jazib-console">
    <title>Vortex AI - Executive Workspace</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-base: #05070b;
            --bg-sidebar: #090d16;
            --bg-panel: #0e1422;
            --border-glass: rgba(255, 255, 255, 0.08);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-color: #6366f1;
            --accent-glow: rgba(99, 102, 241, 0.25);
            --sidebar-width: 280px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-main);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Sidebar Styles */
        .sidebar {
            width: var(--sidebar-width);
            background-color: var(--bg-sidebar);
            border-right: 1px solid var(--border-glass);
            display: flex;
            flex-direction: column;
            padding: 20px 16px;
            transition: transform 0.3s ease, width 0.3s ease;
            z-index: 100;
        }

        .sidebar.collapsed {
            transform: translateX(calc(-1 * var(--sidebar-width)));
            width: 0;
            padding: 0;
            border: none;
        }

        .sidebar-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .brand-box {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-logo {
            width: 36px;
            height: 36px;
            background: linear-gradient(135deg, #6366f1 0%, #0ea5e9 100%);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 18px;
            color: white;
            box-shadow: 0 0 20px var(--accent-glow);
        }

        .brand-title {
            font-size: 18px;
            font-weight: 700;
            letter-spacing: -0.5px;
            color: #ffffff;
        }

        .collapse-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 18px;
            padding: 4px;
            border-radius: 6px;
        }
        .collapse-btn:hover { background: rgba(255,255,255,0.05); color: #fff; }

        .creator-tag {
            font-size: 11px;
            color: var(--text-muted);
            margin-bottom: 24px;
            padding-left: 48px;
        }
        .creator-tag span { color: #38bdf8; font-weight: 600; }

        .nav-btn {
            background: transparent;
            border: none;
            color: var(--text-main);
            padding: 10px 12px;
            border-radius: 10px;
            text-align: left;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 12px;
            width: 100%;
            margin-bottom: 6px;
            transition: all 0.2s ease;
        }
        .nav-btn:hover, .nav-btn.active {
            background-color: rgba(255, 255, 255, 0.05);
            color: #ffffff;
        }

        .menu-section {
            margin-bottom: 20px;
        }
        .section-title {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--text-muted);
            margin: 16px 0 8px 12px;
            font-weight: 700;
        }

        .history-list {
            flex: 1;
            overflow-y: auto;
        }
        .history-list::-webkit-scrollbar { width: 4px; }
        .history-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 2px; }
        
        .history-item {
            padding: 8px 12px;
            font-size: 12px;
            color: var(--text-muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            cursor: pointer;
            border-radius: 6px;
        }
        .history-item:hover { background: rgba(255,255,255,0.03); color: #fff; }

        .sidebar-footer {
            margin-top: auto;
            border-top: 1px solid var(--border-glass);
            padding-top: 16px;
        }

        /* Workspace Styles */
        .main-workspace {
            flex: 1;
            display: flex;
            flex-direction: column;
            background-color: var(--bg-base);
            position: relative;
        }

        /* Top Header */
        .top-header {
            height: 60px;
            border-bottom: 1px solid var(--border-glass);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            background-color: var(--bg-base);
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        .menu-icon {
            background: transparent;
            border: none;
            color: var(--text-main);
            cursor: pointer;
            font-size: 20px;
        }
        .header-title {
            font-size: 14px;
            font-weight: 600;
            color: #38bdf8;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .top-icon-btn {
            background: transparent;
            border: 1px solid var(--border-glass);
            color: var(--text-muted);
            width: 32px;
            height: 32px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: 0.2s;
            font-size: 13px;
        }
        .top-icon-btn:hover { background: rgba(255,255,255,0.05); color: #fff; }
        
        .upgrade-btn {
            background: linear-gradient(135deg, #6366f1 0%, #38bdf8 100%);
            border: none;
            color: white;
            padding: 6px 16px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 15px var(--accent-glow);
        }

        /* Chat Container */
        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 40px 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 24px;
        }

        .welcome-center {
            text-align: center;
            margin: auto;
        }
        .welcome-center h1 {
            font-size: 40px;
            font-weight: 700;
            background: linear-gradient(90deg, #f8fafc, #94a3b8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 12px;
        }
        .welcome-center p {
            color: var(--text-muted);
            font-size: 16px;
        }

        .bubble {
            max-width: 800px;
            width: 100%;
            line-height: 1.6;
            font-size: 14px;
        }
        .bubble.user {
            text-align: right;
        }
        .bubble-content {
            display: inline-block;
            padding: 12px 16px;
            border-radius: 12px;
            text-align: left;
        }
        .bubble.user .bubble-content {
            background: var(--bg-panel);
            color: #fff;
            border-bottom-right-radius: 2px;
        }
        .bubble.ai .bubble-content {
            background: transparent;
            color: var(--text-main);
        }

        /* Input Area */
        .input-wrapper {
            padding: 20px 24px;
            background-color: var(--bg-base);
            border-top: 1px solid var(--border-glass);
        }
        .input-box {
            max-width: 800px;
            margin: 0 auto;
            background-color: var(--bg-panel);
            border: 1px solid var(--border-glass);
            border-radius: 16px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            transition: 0.3s;
        }
        .input-box:focus-within {
            border-color: var(--accent-color);
            box-shadow: 0 0 15px var(--accent-glow);
        }
        
        .textarea-el {
            width: 100%;
            background: transparent;
            border: none;
            color: var(--text-main);
            font-size: 14px;
            resize: none;
            outline: none;
            min-height: 24px;
            max-height: 120px;
        }

        .toolbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .tools-left {
            display: flex;
            gap: 8px;
        }
        .tool-icon {
            background: transparent;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 16px;
            width: 36px;
            height: 36px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.2s;
        }
        .tool-icon:hover { background: rgba(255,255,255,0.05); color: #fff; }
        
        .mic-icon.recording {
            color: #ef4444;
            animation: pulse 1s infinite;
        }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }

        .send-btn {
            background: var(--accent-color);
            color: white;
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            transition: 0.2s;
        }
        .send-btn:hover { background: #4f46e5; }

        /* Modals */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.8);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .modal-content {
            background: var(--bg-panel);
            border: 1px solid var(--border-glass);
            border-radius: 16px;
            width: 500px;
            max-width: 100%;
            padding: 24px;
            animation: slideIn 0.3s ease;
        }
        @keyframes slideIn { from { transform: translateY(30px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .modal-header {
            display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;
        }
        .modal-title { font-size: 18px; font-weight: 600; color: #fff; }
        .close-modal { background: transparent; border: none; color: var(--text-muted); cursor: pointer; font-size: 18px; }

        .tool-option {
            background: rgba(255,255,255,0.03);
            border: 1px solid var(--border-glass);
            padding: 16px;
            border-radius: 12px;
            margin-bottom: 12px;
            cursor: pointer
