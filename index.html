<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vortex AI - Executive Workspace</title>
    <style>
        /* Base Reset & Theme */
        body {
            margin: 0;
            padding: 0;
            background-color: #121212;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Main Workspace Area */
        .workspace-main {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
            padding: 20px;
            box-sizing: border-box;
            position: relative;
        }

        /* Chat Input Container */
        .chat-input-container {
            position: relative;
            display: flex;
            align-items: center;
            background-color: #1e1e1e;
            border: 1px solid #333;
            border-radius: 12px;
            padding: 10px 14px;
            width: 100%;
            max-width: 800px;
            box-sizing: border-box;
            margin-bottom: 20px;
        }

        .chat-input-container textarea {
            flex: 1;
            background: transparent;
            border: none;
            color: #ffffff;
            font-size: 15px;
            font-family: inherit;
            resize: none;
            outline: none;
            max-height: 150px;
            overflow-y: auto;
            padding-left: 110px;
            padding-right: 40px;
            line-height: 1.5;
        }

        .chat-input-container textarea::placeholder {
            color: #888;
        }

        .input-actions-left {
            position: absolute;
            left: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .action-btn, .send-btn {
            background: transparent;
            border: none;
            color: #aaa;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            transition: background-color 0.2s, color 0.2s;
        }

        .action-btn:hover, .send-btn:hover {
            background-color: rgba(255, 255, 255, 0.1);
            color: #ffffff;
        }

        .action-btn .icon, .send-btn .icon {
            width: 18px;
            height: 18px;
        }

        .send-btn {
            position: absolute;
            right: 12px;
            background-color: #3b82f6;
            color: #ffffff;
        }

        .send-btn:hover {
            background-color: #2563eb;
        }

        /* Active/Recording state for voice button */
        .action-btn.voice-trigger.recording {
            color: #ef4444;
            background-color: rgba(239, 68, 68, 0.15);
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>

    <div class="workspace-main">
        <div class="chat-input-container">
            <div class="input-actions-left">
                <button type="button" class="action-btn" title="Add attachment">
                    <svg class="icon" viewBox="0 0 24 24"><path fill="currentColor" d="M19,13H13V19H11V13H5V11H11V5H13V11H19V13Z"/></svg>
                </button>
                <button type="button" class="action-btn" title="Generate image">
                    <svg class="icon" viewBox="0 0 24 24"><path fill="currentColor" d="M21,19V5C21,3.89 20.1,3 19,3H5C3.9,3 3,3.89 3,5V19A2,2 0 0,0 5,21H19A2,2 0 0,0 21,19M8.5,13.5L11,16.5L14.5,12L19,18H5M5,5H19V17L14.5,11L11,15.5L8.5,12.5L5,17V5Z"/></svg>
                </button>
                <button type="button" class="action-btn voice-trigger" title="Voice Recorder">
                    <svg class="icon" viewBox="0 0 24 24"><path fill="currentColor" d="M12,2A3,3 0 0,1 15,5V11A3,3 0 0,1 12,14A3,3 0 0,1 9,11V5A3,3 0 0,1 12,2M19,11C19,14.53 16.39,17.44 13,17.93V21H11V17.93C7.61,17.44 5,14.53 5,11H7A5,5 0 0,0 12,16A5,5 0 0,0 17,11H19Z"/></svg>
                </button>
            </div>

            <textarea placeholder="Ask Vortex AI or use voice..." rows="1"></textarea>

            <button type="button" class="send-btn" title="Send message">
                <svg class="icon" viewBox="0 0 24 24"><path fill="currentColor" d="M2,21L23,12L2,3V10L17,12L2,14V21Z"/></svg>
            </button>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const textarea = document.querySelector('.chat-input-container textarea');
            const voiceBtn = document.querySelector('.action-btn.voice-trigger');
            const sendBtn = document.querySelector('.send-btn');

            // Auto-resize textarea box dynamically as text grows
            textarea.addEventListener('input', function() {
                this.style.height = 'auto';
                this.style.height = (this.scrollHeight) + 'px';
            });

            // Web Speech API handling for voice features
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            let recognition = null;
            let isRecording = false;

            if (SpeechRecognition) {
                recognition = new SpeechRecognition();
                recognition.continuous = false;
                recognition.interimResults = true;
                recognition.lang = 'en-US';

                recognition.onstart = () => {
                    isRecording = true;
                    voiceBtn.classList.add('recording');
                    textarea.placeholder = "Listening... Speak now...";
                };

                recognition.onresult = (event) => {
                    const transcript = Array.from(event.results)
                        .map(result => result[0])
                        .map(result => result.transcript)
                        .join('');
                    textarea.value = transcript;
                    textarea.style.height = 'auto';
                    textarea.style.height = (textarea.scrollHeight) + 'px';
                };

                recognition.onerror = (event) => {
                    console.error('Speech recognition error:', event.error);
                    stopRecordingState();
                };

                recognition.onend = () => {
                    stopRecordingState();
                };
            }

            function stopRecordingState() {
                isRecording = false;
                voiceBtn.classList.remove('recording');
                textarea.placeholder = "Ask Vortex AI or use voice...";
            }

            // Voice button trigger listener
            if (voiceBtn) {
                voiceBtn.addEventListener('click', () => {
                    if (!recognition) {
                        alert("Speech recognition is unavailable or blocked in this browser. Ensure you are testing via localhost or a secure HTTPS deployment.");
                        return;
                    }

                    if (isRecording) {
                        recognition.stop();
                    } else {
                        try {
                            recognition.start();
                        } catch (err) {
                            console.error("Recognition conflict error:", err);
                        }
                    }
                });
            }

            // Message submission action
            if (sendBtn) {
                sendBtn.addEventListener('click', () => {
                    const messageText = textarea.value.trim();
                    if (messageText) {
                        console.log("Transmitted prompt:", messageText);
                        textarea.value = '';
                        textarea.style.height = 'auto';
                    }
                });
            }
        });
    </script>
</body>
</html>
